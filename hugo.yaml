baseURL: https://agentregistry.dev/
languageCode: en-us
title: agentregistry

# The `markdown` and `llms` output formats are defined by Hextra (imported
# transitively via docs-theme-extras) and rendered by extras' templates
# (page.markdown.md, llms.txt, docs/section.llms.txt). `markdown` emits a raw
# `<page>.md` beside each HTML page (the source external LLM fetches use);
# `llms` emits `/llms.txt` (a site index for AI crawlers) plus per-section
# variants. agentregistry is pure docs, so every page is in scope.
outputs:
  home: [HTML, RSS, llms]
  page: [HTML, markdown]
  section: [HTML, RSS, markdown, llms]

# Enable dark mode by default
params:
  # Default social-share image for OpenGraph / Twitter cards (og:image),
  # emitted by Hextra's opengraph.html and docs-theme-extras' twitter_cards.html.
  # Card committed at static/ogimage.png (1200x630).
  images:
    - /ogimage.png

  # Tells docs-theme-extras which brand CSS layer + font stack to load
  # (see the module's layouts/partials/themeExtras/head-end.html). "oss"
  # loads brand-oss.css and Open Sans; "enterprise" loads brand-enterprise.css.
  themeExtras:
    brand: oss
    # Canonical production host (scheme + hostname, no trailing slash, no path).
    # Read by the docs-theme-extras module's `utils/prod-host` partial and reused
    # across layouts (copy-markdown, llms.txt, page-to-markdown) that emit
    # absolute URLs which need to resolve when pasted outside the build's
    # preview URL.
    prodHost: "https://agentregistry.dev"

  theme:
    default: dark
    displayToggle: true
  
  navbar:
    displayTitle: false
    displayLogo: true
    width: wide
    logo:
      path: img/agent-registry-logo.svg
      dark: img/agent-registry-logo-dark.svg
      width: 160
      height: 120
    
  page:
    width: full

  # agentregistry is a flat docs set where /docs/ is the real entry point, so
  # render the left nav on the docs-index landing (the theme hides it by
  # default, which suits versioned sites' version-picker landings).
  sidebar:
    showOnLanding: true

  footer:
    displayCopyright: true
    displayPoweredBy: false

  # "Was this page helpful?" widget at the bottom of docs pages (same as
  # agw/kgw). Thumbs-down opens a GitHub issue against issueRepo. Suppress
  # per-page with `hide_feedback: true` in front matter.
  feedback:
    enable: false
    issueRepo: agentregistry-dev/website

  # Intro line placed at the top of the generated /llms.txt (see the `llms`
  # output format above). Read by extras' llms.txt template.
  llms:
    docsIntro: agentregistry is an open source registry for discovering, publishing, and sharing AI agents and MCP (Model Context Protocol) servers.

  # External links
  editURL:
    enable: true
    base: https://github.com/agentregistry-dev/agentregistry
  
  # Custom params
  github: https://github.com/agentregistry-dev/agentregistry
  discord: https://discord.gg/Af8bX99dbX
  # Optional RSS <author> / managingEditor (Hugo ≥0.156 removed .Site.Author; see layouts/list.rss.xml)
  author:
    name: agentregistry
  # Google Tag Manager (same pattern as ambientmesh.io: layouts/partials/custom/head-end.html + baseof noscript)
  gtmContainerID: "GTM-M9B72GP2"
  
  # Search
  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: summary

# Enable emoji in markdown
enableEmoji: true

# Enable GitInfo
enableGitInfo: true

# Menu configuration
menu:
  main:
    - name: Community
      url: https://discord.gg/Af8bX99dbX
      weight: 1
    - name: Get Started
      pageRef: /docs/quickstart
      weight: 2
    - name: Enterprise
      url: https://www.solo.io/products/agentregistry
      weight: 3
      params:
        external: true
    - name: Search
      weight: 7
      params:
        type: search
    - name: GitHub
      weight: 10
      url: https://github.com/agentregistry-dev/website
      params:
        icon: github
    - name: Theme
      weight: 11
      params:
        type: theme-toggle

# Module imports
module:
  imports:
    # hextra used to live here as a sibling import; docs-theme-extras
    # now declares the hextra import itself, so consumers no longer
    # need to list it separately. The shadowing order stays correct:
    # docs-theme-extras's own layouts win over the transitively-imported
    # hextra ones.
    - path: github.com/solo-io/docs-theme-extras
  mounts:
    - source: assets
      target: assets
    - disableWatch: true
      source: hugo_stats.json
      target: assets/notwatching/hugo_stats.json

# Markup configuration
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

# Build configuration
build:
  writeStats: true
  buildStats:
    enable: true
  cachebusters:
  - source: 'assets/notwatching/hugo_stats\.json'
    target: css
  - source: '(postcss|tailwind)\.config\.js'
    target: css
