# Configuration for the docs-theme-extras HTML test harness when run against
# agentregistry-oss.
#
# The harness lives in github.com/solo-io/docs-theme-extras and reads this file
# via the DOCS_TEST_CONFIG env var (set by the Makefile or CI). All relative
# paths are resolved against this file's directory. The harness does NOT build
# the site — `hugo` runs first and writes to builtRoot.
#
# First-pass config: structural HTML quality (no shortcode leaks, no markdown
# bleed, image alt text, console errors, contrast) against the production build.
# Tighten/expand as the suite stabilizes.

version = "1"
name    = "agentregistry-oss"
brand   = "oss"

# Where the consumer's built HTML lives. Everything operates on this tree.
builtRoot = "./public"
baseURL   = "/"

# Hugo build log for hugo-warnings.spec. The Makefile targets and the CI build
# step write the Hugo build output here; the spec scans it for ERROR / WARN
# lines (filtered by [allowlists].hugoWarnings).
buildLog  = "./.build.log"

# Source-tree roots for author-side lints (e.g. curl-quotes scans markdown
# directly). Narrowed to docs content so lints don't trip on the marketing
# landing page.
scanRoots = [
  "./content/docs",
]

# NOTE: agentregistry is a flat, unversioned docs site (/docs/<section>/<page>/)
# with no site.Params.sections and no version segment. There is intentionally
# no [versioning] block — version-aware specs detect the absence and skip
# gracefully (same mechanism agw's standalone/unversioned docs rely on).

# All checks default to enabled. No [checks] overrides are needed: agr runs the
# full default set. (The former `smoke`/`crossBrowser` toggles were removed from
# the harness — smoke folded into the `content` project scoped by CONTENT_DIR,
# and cross-browser is now selected per Playwright project.)

# Allowlists for known-benign noise that surfaces against real content (the
# module's bundled fixture has none of this). Tighten as content is fixed.
[allowlists]
hugoWarnings = [
  "\\.Site\\.Data was deprecated",
  "'items' parameter of the 'tabs' shortcode is deprecated",
]
consoleErrors = [
  # Third-party analytics/chat (GA, GTM, Qualified) make backend calls on page
  # init that fail in the offline test environment, surfacing as a bare
  # "invalid_request" pageerror with no stack. Not fixable without a live
  # backend — suppress until those scripts are refactored to not throw on init.
  "invalid_request",
  # Qualified's chat widget posts to its own sentry proxy on every page load, so
  # a site-wide crawl fires one request per page within a few seconds and trips
  # that endpoint's rate limit. Whichever pages land after the limit then fail
  # with a 429, which makes the failing set shift run to run (48/16/17/0 failures
  # across four runs of the same suite) and reads as a content regression when it
  # is a property of the crawl's request rate. Scoped to the status AND the host
  # so a genuine 429 from our own origin still fails the check.
  #
  # TEMPORARY: this suppresses the error but the request still fires. The real
  # fix is to block third-party hosts at the network layer during the crawl —
  # see solo-io/docs-theme-extras#39. Remove this entry once that lands.
  "status of 429 .*app\\.qualified\\.com",
  # NOTE: agr previously allowlisted two Hextra main.min.js null-dereferences
  # (reading 'removeAttribute' / 'addEventListener') that fired on pages with no
  # real sidebar (e.g. the /docs/ landing page), where main.js can't find the
  # toggle markup it expects. Those are now FIXED at the source: hidden stand-in
  # elements (.hextra-hamburger-menu wrapping an <svg>, and
  # .hextra-sidebar-container) render on every page via _partials/custom/footer.html,
  # so main.js no longer null-derefs. The allowlist entries were removed so this
  # console guard is re-armed — if the stand-ins regress, the error surfaces here
  # (and in the static "Hextra hamburger toggle target" guard in docs-theme-extras).
  # Ported from the same fix in agw-oss.
]

# Builds this source tree is rendered under, for the gateAxisCollision lint.
#
# `conditional-text` gates on two axes — the build condition and the page's
# section segment — through one token namespace, so a token naming a section on
# one axis and a product on the other is true twice and both sides of an
# intended either/or render.
#
# THIS SITE'S OWN BUILD CANNOT FIRE A GATE AT ALL. It registers no
# `params.sections`, and in `url` mode utils/page-context.html assigns a
# condition only when the path carries a section AND a version — with no
# sections registered that never happens, so the condition is always "" and
# conditional-text emits nothing. Consistent with the corpus: it uses no gates
# today.
#
# The docs hub ships an agentregistry product (buildCondition "agentregistry"),
# but its module import of this repo is still commented out, so nothing here is
# rendered under that condition yet. The entry below is staged for when it is:
# once the import is enabled, a gate written here starts resolving downstream
# while staying inert upstream, which is precisely the asymmetry this lint
# catches.
[[gateAxes]]
name      = "docs-hub / agentregistry"
condition = "agentregistry"
sections  = []
